[project]
name = "codereviewer"
version = "0.1.0"
description = "AI PR-review agent (Python, FastAPI, LangGraph, Groq)"
readme = "README.md"
authors = [
    { name = "aizaasim", email = "aezaasim132@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.140.7",
    "githubkit[auth-app]>=0.16.0",
    "httpx>=0.28.1",
    "langchain-core>=1.5.1",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.9",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "unidiff>=1.0.0",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "manual: integration tests that hit real external services",
]
